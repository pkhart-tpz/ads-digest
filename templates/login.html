<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TPZ Ads Digest</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #08080f;
            color: #e4e4eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #0d0d20;
            border: 1px solid #1e1e3a;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .brand { font-size: 11px; color: #6366f1; font-weight: 700; letter-spacing: 3px; margin-bottom: 6px; }
        h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a18;
            border: 1px solid #1e1e3a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 16px;
        }
        input:focus { border-color: #6366f1; }
        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover { background: #7c7ff5; }
        .flash { padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; background: #1a0a0a; border: 1px solid #7f1d1d; color: #f87171; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">TPZ DAILY ADS DIGEST</div>
        <h1>🔐 Login</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="password" placeholder="Dashboard password" autofocus>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
